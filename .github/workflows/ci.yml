name: Validate package

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0, Node 24
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0, Node 24
        with:
          node-version: '24.20.0' # includes npm 11.19.0
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run release:check

  host:
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        opencode: ['2.3.2', '2.4.1']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0, Node 24
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0, Node 24
        with:
          node-version: '24.20.0'
      - run: npm ci
      - run: npm run build
      - name: Install isolated target CLI
        env:
          OPENCODE_VERSION: ${{ matrix.opencode }}
        shell: pwsh
        run: |
          npm install --prefix "$env:RUNNER_TEMP/opencode-cli" --no-audit --no-fund "@opencode/cli@$env:OPENCODE_VERSION"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "SCHEDULER_OPENCODE_BIN=$env:RUNNER_TEMP/opencode-cli/node_modules/@opencode/cli/bin/opencode.exe" >> $env:GITHUB_ENV
      - name: Run real isolated host suite
        env:
          SCHEDULER_REAL_HOST: '1'
          SCHEDULER_TEST_TMP: ${{ runner.temp }}
        run: npm run test:integration
