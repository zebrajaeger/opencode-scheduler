name: Publish stable npm package

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: npm-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0, Node 24
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0, Node 24
        with:
          node-version: '24.20.0' # npm 11.19.0; OIDC requires >=11.5.1
      - name: Fetch authoritative master
        run: git fetch --no-tags origin +refs/heads/master:refs/remotes/origin/master
      - name: Validate tag and ancestry before installing dependencies
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/release.mjs identity
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run release:check
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0, Node 24
        with:
          name: verified-npm-package
          path: |
            .release-artifacts/package.tgz
            .release-artifacts/metadata.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0, Node 24
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0, Node 24
        with:
          node-version: '24.20.0'
          registry-url: 'https://registry.npmjs.org'
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0, Node 24
        with:
          name: verified-npm-package
          path: .release-artifacts
      - name: Verify handoff and refuse existing npm version
        run: node scripts/release.mjs preflight
      - name: Publish verified bytes with OIDC and provenance
        run: npm publish .release-artifacts/package.tgz --access public --provenance --ignore-scripts
      - name: Verify public registry integrity and provenance
        run: node scripts/release.mjs registry
