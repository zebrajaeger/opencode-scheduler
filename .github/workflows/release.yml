name: Publish stable npm package

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: npm-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.20.0' # npm 11.19.0; OIDC requires >=11.5.1
      - name: Fetch authoritative master
        run: git fetch --no-tags origin +refs/heads/master:refs/remotes/origin/master
      - name: Validate tag and ancestry before installing dependencies
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/release.mjs identity
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run release:check
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: verified-npm-package
          path: |
            .release-artifacts/package.tgz
            .release-artifacts/metadata.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.20.0'
          registry-url: 'https://registry.npmjs.org'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: verified-npm-package
          path: .release-artifacts
      - name: Verify handoff and refuse existing npm version
        run: node scripts/release.mjs preflight
      - name: Publish verified bytes with OIDC and provenance
        run: npm publish .release-artifacts/package.tgz --access public --provenance --ignore-scripts
      - name: Verify public registry integrity and provenance
        run: node scripts/release.mjs registry
